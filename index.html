<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="中文 ↔ 泰文 即時語音翻譯，適用於工廠溝通" />
  <title>中泰翻譯</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <!-- 主畫面：單畫面雙向對話 -->
  <div id="main-screen" class="screen active">
    <header class="top-bar">
      <button id="btn-menu" class="icon-btn" aria-label="設定">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16" />
          <path d="M4 12h16" />
          <path d="M4 18h16" />
        </svg>
      </button>
      <div class="top-title">
        <span class="app-name">
          <img class="brand-logo logo-blue" src="/logo/藍色Logo.png" alt="信鋐工業" />
          <img class="brand-logo logo-white" src="/logo/白色Logo.png" alt="信鋐工業" />
          <span>中泰翻譯</span>
        </span>
        <span id="quota-chip" class="quota-chip" style="display:none"></span>
      </div>
      <button id="btn-gender" class="gender-chip" aria-label="泰文語尾">👨 ครับ</button>
      <button id="btn-history" class="icon-btn" aria-label="翻譯紀錄">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M12 7v5l4 2" />
        </svg>
      </button>
    </header>

    <div id="offline-banner" class="offline-banner" style="display:none">
      ⚡ 離線中：常用句仍可使用 / ออฟไลน์ ใช้วลีสำเร็จรูปได้
    </div>

    <!-- 對話區 -->
    <div id="chat-area" class="chat-area">
      <div class="chat-placeholder">
        <div class="placeholder-icon">🎤</div>
        <p>按住下方按鈕說話<br />或點常用句、輸入文字</p>
        <p class="placeholder-sub">กดปุ่มค้างไว้เพื่อพูด<br />หรือแตะวลีสำเร็จรูป</p>
      </div>
    </div>

    <!-- 常用句快捷列 -->
    <div class="quick-strip">
      <button id="btn-phrasebook" class="phrasebook-btn">📖<span>常用句<br />วลี</span></button>
      <div id="quick-scroll" class="quick-phrases-scroll"></div>
    </div>

    <!-- 文字輸入（自動判斷中/泰） -->
    <div class="text-input-bar">
      <input id="text-input" type="text" class="text-input-field" placeholder="輸入中文或泰文 / พิมพ์จีนหรือไทย..."
        autocomplete="off" />
      <button id="btn-send" class="send-btn" aria-label="送出">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z" />
          <path d="M22 2 11 13" />
        </svg>
      </button>
    </div>

    <!-- 雙錄音鍵：誰要說話就按住誰的 -->
    <div id="record-status" class="record-status">按住說話，放開翻譯 / กดค้างเพื่อพูด</div>
    <div class="dual-record">
      <button id="btn-rec-zh" class="rec-btn rec-zh" aria-label="按住說中文">
        <span class="rec-icon">🎤</span>
        <span class="rec-label">按住說中文</span>
      </button>
      <button id="btn-rec-th" class="rec-btn rec-th" aria-label="กดค้างพูดไทย">
        <span class="rec-icon">🎤</span>
        <span class="rec-label">กดค้างพูดไทย</span>
      </button>
    </div>
  </div>

  <!-- 常用句庫畫面 -->
  <div id="phrasebook-screen" class="screen">
    <header class="top-bar">
      <button id="btn-pb-back" class="icon-btn" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
      </button>
      <div class="mode-label">📖 常用句 / วลีสำเร็จรูป</div>
      <div style="width:40px"></div>
    </header>
    <div id="pb-cats" class="pb-cats"></div>
    <div class="history-search">
      <input id="pb-search" type="text" class="text-input-field" placeholder="搜尋常用句或術語 / ค้นหา..." />
    </div>
    <div id="pb-list" class="pb-list"></div>
  </div>

  <!-- 歷史紀錄畫面 -->
  <div id="history-screen" class="screen">
    <header class="top-bar">
      <button id="btn-history-back" class="icon-btn" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
      </button>
      <div class="mode-label">翻譯紀錄</div>
      <button id="btn-export-history" class="icon-btn" aria-label="匯出" title="匯出 CSV">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="m7 10 5 5 5-5" />
          <path d="M12 15V3" />
        </svg>
      </button>
      <button id="btn-clear-history" class="icon-btn" aria-label="清除" title="清除所有紀錄">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18" />
          <path d="M8 6V4h8v2" />
          <path d="M19 6l-1 14H6L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      </button>
    </header>
    <div class="history-search">
      <input id="history-search-input" type="text" placeholder="搜尋紀錄 / ค้นหา..." class="text-input-field" />
    </div>
    <div id="history-list" class="history-list">
      <div class="history-empty">
        <p>📝 還沒有翻譯紀錄</p>
        <p class="placeholder-sub">ยังไม่มีประวัติ</p>
      </div>
    </div>
  </div>

  <!-- 設定對話框 -->
  <div id="settings-dialog" class="sheet-dialog" style="display:none">
    <div class="sheet-dialog-content">
      <h3>⚙️ 設定 / ตั้งค่า</h3>
      <button id="btn-theme" class="history-btn">🌙 切換深色模式</button>
      <button id="btn-mic-permission" class="history-btn" style="display:none">🎤 允許使用麥克風 / อนุญาตไมโครโฟน</button>
      <button id="btn-reset-quota" class="history-btn">🔄 重置本機額度計數</button>
      <div class="settings-field">
        <label class="field-label" for="sheet-url-input">後端網址（管理者設定，一般使用者免填）</label>
        <input id="sheet-url-input" type="url" class="text-input-field" placeholder="https://script.google.com/..." />
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="btn-sheet-save" class="history-btn" style="flex:1;margin-top:0">💾 儲存</button>
        </div>
        <div id="sheet-status" style="font-size:12px;margin-top:8px;text-align:center"></div>
      </div>
      <button id="btn-settings-close" class="history-btn" style="margin-top:16px">關閉 / ปิด</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
